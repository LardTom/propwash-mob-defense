tasks.register('prepareServerD6') {
    group = 'mobdefense'
    description = 'D6: eula.txt und server.properties für den Lasttest (flache Welt, keine Pause ohne Spieler), alte Welt und Ergebnisse weg.'
    def dir = file(mdD6Dir)
    outputs.upToDateWhen { false }
    doLast {
        dir.mkdirs()
        new File(dir, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(dir, 'server.properties').setText([
                'online-mode=false',
                "server-port=${25631 + (System.getenv('PROPWASH_MC_SLOT') ?: '0').toInteger()}".toString(),
                'level-type=minecraft\\:flat',
                'generator-settings={"layers"\\:[{"block"\\:"minecraft\\:bedrock","height"\\:1},{"block"\\:"minecraft\\:dirt","height"\\:2},{"block"\\:"minecraft\\:grass_block","height"\\:1}],"biome"\\:"minecraft\\:plains"}',
                'generate-structures=false',
                'spawn-protection=0',
                'difficulty=normal',
                'pause-when-empty-seconds=0',
                'view-distance=6',
                'simulation-distance=5',
                'sync-chunk-writes=false',
        ].join('\n') + '\n', 'UTF-8')
        new File(dir, 'world').deleteDir()
        ['mobdefense-selftest-result.txt', 'mobdefense-d6-result.txt', 'jointest.stop', 'mobdefense-classload.log'].each { new File(dir, it).delete() }
    }
