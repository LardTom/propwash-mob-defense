tasks.named('check') {
    dependsOn('compileJointestJava')
}

ext.mdD8Dir = 'runs/d8-server'

class MdD8Stop extends InputStream {
    private final File log
    private long start = -1L
    private final long settleMillis
    private final long limitMillis
    private byte[] bytes
    private int index

    MdD8Stop(File log, long settleMillis, long limitMillis) {
        this.log = log
        this.settleMillis = settleMillis
        this.limitMillis = limitMillis
    }

    @Override
    int read() {
        if (bytes == null) {
            start = System.currentTimeMillis()
            long done = -1L
            while (true) {
                long now = System.currentTimeMillis()
                String text = done < 0 && log.exists() && log.lastModified() >= start ? log.getText('UTF-8') : ''
                if (done < 0 && text.contains('Done (') && !text.contains('[Mob-Defense-D8]')) {
                    done = now
                }
                if (done >= 0 && now - done >= settleMillis || now - start >= limitMillis) {
                    break
                }
                Thread.sleep(500L)
            }
            bytes = 'stop\n'.getBytes('UTF-8')
        }
        return index < bytes.length ? (bytes[index++] & 0xff) : -1
    }
}

tasks.register('prepareServerD8') {
    group = 'mobdefense'
    description = 'D8: eula.txt und server.properties für die Welt mit, ohne und wieder mit Mob Defense, alte Welt weg.'
    def dir = file(mdD8Dir)
    outputs.upToDateWhen { false }
    doLast {
        dir.mkdirs()
        new File(dir, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(dir, 'server.properties').setText([
                'online-mode=false',
                "server-port=${25631 + (System.getenv('PROPWASH_MC_SLOT') ?: '0').toInteger()}".toString(),
                'level-type=minecraft\\:flat',
                'generator-settings={"layers"\\:[{"block"\\:"minecraft\\:bedrock","height"\\:1},{"block"\\:"minecraft\\:dirt","height"\\:2},{"block"\\:"minecraft\\:grass_block","height"\\:1}],"biome"\\:"minecraft\\:plains"}',
                'generate-structures=false',
                'spawn-protection=16',
                'view-distance=4',
                'simulation-distance=4',
                'sync-chunk-writes=true',
        ].join('\n') + '\n', 'UTF-8')
        new File(dir, 'world').deleteDir()
        ['d8-prepare.properties', 'd8-noaddon.txt', 'mobdefense-selftest-result.txt'].each { new File(dir, it).delete() }
    }
}

loom {
    runs {
        serverD8Prepare {
            server()
            source(sourceSets.devtest)
            setConfigName('Fabric Server D8 mit Mob Defense')
            ideConfigGenerated(false)
            runDir(mdD8Dir)
            property('mobdefense.d8', 'prepare')
        }
        serverD8NoAddon {
            server()
            source(sourceSets.jointest)
            setConfigName('Fabric Server D8 ohne Mob Defense')
            ideConfigGenerated(false)
            runDir(mdD8Dir)
        }
        serverD8Verify {
            server()
            source(sourceSets.devtest)
            setConfigName('Fabric Server D8 wieder mit Mob Defense')
            ideConfigGenerated(false)
            runDir(mdD8Dir)
            property('mobdefense.d8', 'verify')
        }
    }
}

def mdD8Sha = { File f -> f.exists() ? java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() : 'fehlt' }

tasks.matching { it.name in ['runServerD8Prepare', 'runServerD8Verify'] }.configureEach { task ->
    def resultFile = file("${mdD8Dir}/mobdefense-selftest-result.txt")
    task.group = 'mobdefense'
    task.doFirst { resultFile.delete() }
    task.doLast {
        if (!resultFile.exists()) {
            throw new GradleException("D8 ${task.name}: keine Ergebnisdatei – Server abgestürzt oder vorzeitig beendet?")
        }
        def result = resultFile.getText('UTF-8').trim()
        if (!result.startsWith('PASS')) {
            throw new GradleException("D8 ${task.name} fehlgeschlagen: ${result}")
        }
        logger.lifecycle("D8 ${task.name}: ${result}")
    }
}

tasks.matching { it.name == 'runServerD8Prepare' }.configureEach {
    dependsOn('prepareServerD8')
}

tasks.matching { it.name == 'runServerD8NoAddon' }.configureEach { task ->
    def entities = file("${mdD8Dir}/world/dimensions/minecraft/overworld/entities/r.0.0.mca")
    def noAddon = file("${mdD8Dir}/d8-noaddon.txt")
    def latest = file("${mdD8Dir}/logs/latest.log")
    task.group = 'mobdefense'
    task.mustRunAfter('runServerD8Prepare')
    task.standardInput = new MdD8Stop(latest, 20000L, 300000L)
    def before = [:]
    task.doFirst {
        noAddon.delete()
        if (!file("${mdD8Dir}/d8-prepare.properties").exists()) {
            throw new GradleException('D8 ohne Mob Defense: zuerst runServerD8Prepare')
        }
        before.sha = mdD8Sha(entities)
    }
    task.doLast {
        def after = mdD8Sha(entities)
        def lines = latest.exists() ? latest.readLines('UTF-8') : []
        def mobDefense = lines.findAll { it.contains('Mob Defense') && it.contains('geladen') }
        def errors = lines.findAll { it =~ /\/(ERROR|FATAL)\]/ }
        if (!mobDefense.isEmpty()) {
            throw new GradleException("D8 ohne Mob Defense: Mob Defense wurde doch geladen: ${mobDefense.first()}")
        }
        if (before.sha == after) {
            throw new GradleException('D8 ohne Mob Defense: dimensions/minecraft/overworld/entities/r.0.0.mca unverändert, die Drohne wurde ohne das Add-on nicht geladen und gespeichert')
        }
        noAddon.setText(["Server ohne Mob Defense gestartet und gestoppt", "Drohnen-Chunk neu gespeichert", "${errors.size()} Fehlerzeilen im Log"].join('\n') + '\n', 'UTF-8')
        logger.lifecycle("D8 ohne Mob Defense: Drohnen-Chunk neu gespeichert, ${errors.size()} Fehlerzeilen im Log${errors.isEmpty() ? '' : ', erste: ' + errors.first()}")
    }
}

tasks.matching { it.name == 'runServerD8Verify' }.configureEach {
    mustRunAfter('runServerD8NoAddon')
}

