loom {
    runs {
        serverD6 {
            server()
            source(sourceSets.devtest)
            setConfigName('Fabric Server D6 Last')
            ideConfigGenerated(false)
            runDir(mdD6Dir)
            property('mobdefense.serversmoke', 'true')
            property('mobdefense.d6', 'true')
            environmentVariable('MOBDEFENSE_JOINTEST_HOLD', '900')
            def classLog = file("${mdD6Dir}/mobdefense-classload.log").absolutePath
            vmArg("-Xlog:class+load=info:file=${classLog}:none")
            property('mobdefense.classlog', classLog)
        }
    }
}

tasks.matching { it.name == 'runServerD6' }.configureEach { task ->
    def smokeFile = file("${mdD6Dir}/mobdefense-selftest-result.txt")
    def resultFile = file("${mdD6Dir}/mobdefense-d6-result.txt")
    task.group = 'mobdefense'
    task.dependsOn('prepareServerD6')
    task.doFirst { sourceSets.devtest.output.resourcesDir.mkdirs() }
    task.doLast {
        if (!resultFile.exists()) {
            throw new GradleException('D6: keine Ergebnisdatei – Server abgestürzt oder vorzeitig beendet?')
        }
        def result = resultFile.getText('UTF-8').trim()
        def smoke = smokeFile.exists() ? smokeFile.getText('UTF-8').trim() : 'fehlt'
        def bad = file("${mdD6Dir}/logs/latest.log").readLines('UTF-8').findAll { line ->
            line =~ /\/(ERROR|FATAL)\]/ || line.contains('MixinApplyError') || line.contains('Mixin apply failed')
        }
        if (!result.startsWith('PASS')) {
            throw new GradleException("D6 fehlgeschlagen: ${result}")
        }
        if (!smoke.startsWith('PASS')) {
            throw new GradleException("D6: Server-Prüfungen fehlgeschlagen: ${smoke}")
        }
        if (!bad.isEmpty()) {
            throw new GradleException("D6: ${bad.size()} Fehlerzeilen im Log, erste: ${bad.first()}")
        }
        logger.lifecycle("D6: ${result}")
    }
}
