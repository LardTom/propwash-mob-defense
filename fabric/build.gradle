}

loom {
    mods {
        mobdefense_jointest {
            sourceSet sourceSets.jointest
        }
    }
    runs {
        clientNoAddon {
            client()
            source(sourceSets.jointest)
            setConfigName('Fabric Client ohne Mob Defense')
            ideConfigGenerated(false)
            runDir(rootProject.mdRunDirs.noAddon)
