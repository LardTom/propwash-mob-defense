# Jedes neue Feld muss auch in die expandProps-Tabelle in build-logic/src/main/groovy/multiloader-common.gradle.

# Projekt
version=1.0.0
group=de.lardtom.mobdefense
maven_group=de.lardtom
java_version=25

# Gemeinsam
minecraft_version=26.3
mod_name=Propwash: Mob Defense
mod_author=lardtom
mod_id=mobdefense
license=LicenseRef-PolyForm-Shield-1.0.0
credits=Code, data and assets by lardtom. Add-on for Propwash FPV.
homepage_url=https://www.curseforge.com/minecraft/mc-mods/propwash-mob-defense
description=Add-on for Propwash FPV: a forward dispenser mount with four slots, a spear mount and a firework rocket booster for your drone, and hostile mobs that fight back.
minecraft_version_range=[26.3, 26.4)
neo_form_version=26.3-1

# Propwash FPV (Add-on-API), lokal aus mavenLocal (im Propwash-Repository: ./gradlew publishToMavenLocal)
# Gebaut gegen genau die Nummer, die Propwash an Mob Defense meldet (0.6.0-dev.N, API 1.8); jeden Wechsel macht die Integration.
# Bereiche bis zum Release: Fabric ">=0.6.0-", NeoForge "[0.6.0-alpha,)" (nahmen 0.6.0-dev.N, 0.6.0-rc.N und 0.6.0 an);
# ab dem Release gegen Propwash 0.6.0 die saubere Untergrenze (der Release-Publisher sperrt Vorab-Kennungen in Abhängigkeiten).
propwash_version=0.6.0
propwash_version_range=[0.6.0,)
propwash_fabric_range=>=0.6.0
propwash_api_version=1.8

# Fabric
fabric_version=0.161.0+26.3
fabric_loader_version=0.19.5

# NeoForge
neoforge_version=26.3.0.10-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
